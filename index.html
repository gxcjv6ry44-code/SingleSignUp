<!-- File: SingleUserSignup.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>North Ogden Orchard — Sign Up</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 20px; background:#E5E3DC; }
    .card { max-width: 820px; margin: 0 auto; background: #E5E3DC; padding: 18px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .grid { display:grid; grid-template-columns: 1fr; gap: 12px; }
    .pair { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-weight: 700; font-size: 13px; }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select {
      padding: 10px;
      border: 1px solid #d8dde6;
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    .checks { padding: 12px; background:#fafbfc; border:1px solid #e6e9ef; border-radius: 12px; display:grid; gap: 8px; }
    .row { display:flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button { padding: 10px 14px; border-radius: 12px; border: 0; font-weight: 800; cursor:pointer; }
    button[type="submit"] { background:#2563eb; color:white; }
    .secondary { background:#e5e7eb; }
    .go { background:#16a34a; color:white; }
    .error { color:#b91c1c; font-size: 12px; min-height: 16px; }
    .hint { font-size: 12px; color:#5b6472; }
    pre { margin-top: 12px; padding: 12px; background:#0b1020; color:#e5e7eb; border-radius: 12px; overflow:auto; }
    @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
    a { color: #2563eb; }

    .checks input[type="radio"],
    .checks input[type="checkbox"] {
      width: auto;
      padding: 0;
      border: 0;
    }
    .time-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-weight: 500;
      line-height: 1.35;
    }
    .time-option input[type="radio"] {
      margin-top: 2px;
      flex: 0 0 auto;
    }
    .time-option span {
      display: inline-block;
    }
    .time-row {
      display:flex;
      align-items:flex-start;
      gap:10px;
    }
    .time-row input[type="radio"] {
      margin-top: 2px;
    }
    .time-text {
      font-weight: 500;
      font-size: 13px;
      line-height: 1.35;
      color: #111;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <div style="background:#2f6b2a; color:#fff; padding:14px 18px; border-radius:8px; margin-bottom:18px;">
      <div style="font-size:12px; text-transform:uppercase; letter-spacing:.08em; opacity:.8;">Volunteer Sign Up</div>
      <div style="font-size:20px; font-weight:700; margin-top:2px;">North Ogden Orchard</div>
    </div>

    <form id="signupForm" novalidate>
      <div class="grid" style="margin-top:12px;">
        <div>
          <label for="fullName">Full name *</label><br/>
          <input id="fullName" name="fullName" maxlength="120" autocomplete="name" />
          <div class="error" id="errName"></div>
        </div>

        <div>
          <label for="phone">Phone *</label><br/>
          <input id="phone" name="phone" placeholder="801-555-1234" autocomplete="tel" />
          <div class="error" id="errPhone"></div>
        </div>

        <div>
          <label for="email">Email *</label><br/>
          <input id="email" name="email" type="email" maxlength="120" placeholder="you@example.com" autocomplete="email" />
          <div class="error" id="errEmail"></div>
        </div>

        <div class="pair">
          <div>
            <label for="stake">Stake *</label><br/>
            <select id="stake" name="stake">
              <option value="">Loading…</option>
            </select>
            <div class="error" id="errStake"></div>
          </div>

          <div>
            <label for="ward">Ward *</label><br/>
            <select id="ward" name="ward" disabled>
              <option value="">Choose a stake first…</option>
            </select>
            <div class="error" id="errWard"></div>
          </div>
        </div>

        <div>
          <label for="date">Date *</label><br/>
          <input id="date" name="date" type="date" />
          <div class="hint" id="dateHint">Choose any future date.</div>
          <div class="error" id="errDate"></div>
        </div>
      </div>

      <div style="margin-top:14px;">
        <label>Appointment time *</label>
        <div class="checks" id="timeSlotsGroup" role="radiogroup" aria-label="Appointment time">
          <div class="hint" id="timeSlotsLoading">Loading…</div>
          <div class="error" id="errTime"></div>
        </div>
      </div>

      <div style="margin-top:14px;">
        <label>Text message consent (optional)</label>
        <div class="checks">
          <label style="font-weight: 500; line-height: 1.35;">
            <input id="smsOptIn" name="smsOptIn" type="checkbox" />
            I agree to receive messages from North Ogden Orchard sent via an autodialer, and this agreement isn't a condition of any purchase.
            I also agree to the
            <a href="https://northogdenorchard.net/terms-conditions-and-privacy-policy" target="_blank" rel="noopener noreferrer">Terms of Service and Privacy Policy</a>.
            Approx. 4 msgs/month. Msg &amp; Data rates may apply.
            Text <strong>STOP</strong> to opt-out. Text <strong>HELP</strong> for assistance.
            By submitting this form, I agree that my mobile information will not be shared with third parties/affiliates
            for marketing or promotional purposes. All the above categories exclude text messaging originator opt-in data
            and consent; this information will not be shared with any third parties, except for the necessary opt-in data
            required to facilitate the SMS service.
          </label>
        </div>
      </div>

      <div class="row">
        <button type="submit" id="submitBtn">Submit</button>
        <button type="reset" class="secondary">Reset</button>
        <div class="hint" id="successMsg" style="align-self:center; font-weight:700;"></div>
        <div class="error" id="errSubmit" style="align-self:center;"></div>
      </div>

      <div id="nextSteps" style="margin-top:14px; display:none;">
        <div class="hint" style="font-weight:700; margin-bottom:8px;">
          Next step: Please complete the safety training if you have not done so this year.
        </div>
        <a
          id="safetyLink"
          class="go"
          href="https://northogdenorchard.net/orchardsafety"
          target="_blank"
          rel="noopener noreferrer"
          style="display:inline-block; text-decoration:none; padding:10px 14px; border-radius:12px;"
        >
          Go to Safety Training
        </a>
      </div>
    </form>
  </div>

  <script>
    /***********************
     * CONFIG
     ***********************/
    const SUPABASE_URL = "https://tfkdkekvtuqepjqsgjoc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_JRFxF6A8mDcZX2D05CdoCQ_F6_rDbwh";
    const SITE_ID = 1; // North Ogden Orchard — change per site

    /***********************
     * ELEMENTS
     ***********************/
    const form       = document.getElementById("signupForm");
    const successMsg = document.getElementById("successMsg");
    const submitBtn  = document.getElementById("submitBtn");
    const fullNameEl = document.getElementById("fullName");
    const phoneEl    = document.getElementById("phone");
    const emailEl    = document.getElementById("email");
    const stakeEl    = document.getElementById("stake");
    const wardEl     = document.getElementById("ward");
    const dateEl     = document.getElementById("date");
    const dateHint   = document.getElementById("dateHint");
    const smsOptInEl = document.getElementById("smsOptIn");
    const nextStepsEl= document.getElementById("nextSteps");

    let isSubmitting = false;

    // Cache of all wards loaded from Supabase: [{ id, name, stake_id }]
    let allWards = [];

    // Cache of time slots: [{ id, label, time_range, day_of_week }]
    // day_of_week: 0=Sun…6=Sat; null = any day
    let siteTimeSlots = [];

    /***********************
     * HELPERS
     ***********************/
    function setError(id, msg) {
      const el = document.getElementById(id);
      if (el) el.textContent = msg || "";
    }

    function clearErrors() {
      ["errName","errPhone","errEmail","errStake","errWard",
       "errDate","errTime","errSubmit"].forEach(id => setError(id, ""));
      successMsg.textContent = "";
    }

    // Returns 10-digit string or null
    function normalizePhone(raw) {
      const digits = (raw || "").replace(/\D/g, "");
      if (digits.length === 10) return digits;
      if (digits.length === 11 && digits.startsWith("1")) return digits.slice(1);
      return null;
    }

    function getSelectedTime() {
      const checked = document.querySelector('input[name="timeSlot"]:checked');
      return checked ? checked.value : null;
    }

    function parseLocalDate(yyyyMmDd) {
      if (!yyyyMmDd) return null;
      const [y, m, d] = yyyyMmDd.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function isWednesday(d) { return d && d.getDay() === 3; }

    function toYyyyMmDd(d) {
      const y  = d.getFullYear();
      const m  = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${dd}`;
    }

    function nextWednesday(fromDate) {
      const d    = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
      const diff = (3 - d.getDay() + 7) % 7 || 7; // if today is Wed, go to NEXT Wed
      d.setDate(d.getDate() + diff);
      return d;
    }

    // Returns the day_of_week restriction for the currently selected slot, or null
    function selectedSlotDayRestriction() {
      const label = getSelectedTime();
      if (!label) return null;
      const slot = siteTimeSlots.find(s => s.label === label);
      return slot ? slot.day_of_week : null;
    }

    function nextMatchingDay(fromDate, targetDow) {
      const d    = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
      const diff = (targetDow - d.getDay() + 7) % 7 || 7;
      d.setDate(d.getDate() + diff);
      return d;
    }

    function applyDayRestriction() {
      const dow = selectedSlotDayRestriction();
      if (dow === null || dow === undefined) {
        dateHint.textContent = "Choose any future date.";
        return;
      }
      const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      dateHint.textContent = `This slot is ${dayNames[dow]}s only.`;
      const current = parseLocalDate(dateEl.value);
      const base    = current || new Date();
      if (!current || current.getDay() !== dow) {
        dateEl.value = toYyyyMmDd(nextMatchingDay(base, dow));
      }
    }

    // Convert camelCase stake name → readable label
    // e.g. "BenLomond" → "Ben Lomond", "NorthOgdenEast" → "North Ogden East"
    function stakeLabel(name) {
      return name.replace(/([A-Z])/g, " $1").trim();
    }

    /***********************
     * SUPABASE FETCH
     ***********************/
    async function supaGet(path) {
      const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
        headers: {
          "apikey":        SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
        }
      });
      if (!res.ok) throw new Error("Supabase error " + res.status);
      return res.json();
    }

    async function supaInsert(table, payload) {
      const res = await fetch(SUPABASE_URL + "/rest/v1/" + table, {
        method:  "POST",
        headers: {
          "apikey":        SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type":  "application/json",
          "Prefer":        "return=minimal",
        },
        body: JSON.stringify(payload),
      });
      return res; // caller inspects status
    }

    /***********************
     * LOAD STAKES, WARDS, TIME SLOTS
     ***********************/
    async function loadStakesAndWards() {
      try {
        // Load stakes, wards, and time slots in parallel
        const [stakes, wards, timeSlots] = await Promise.all([
          supaGet("stakes?select=id,name&order=name"),
          supaGet("wards?select=id,name,stake_id&order=name"),
          supaGet(`time_slots?select=id,label,time_range,day_of_week,display_order&site_id=eq.${SITE_ID}&is_active=eq.true&order=display_order`),
        ]);

        allWards     = wards;
        siteTimeSlots = timeSlots;

        // Populate stake dropdown
        stakeEl.innerHTML = '<option value="">Select a stake…</option>';
        stakes.forEach(s => {
          const opt        = document.createElement("option");
          opt.value        = s.id;
          opt.dataset.name = s.name;
          opt.textContent  = stakeLabel(s.name);
          stakeEl.appendChild(opt);
        });

        // Render time slot radio buttons dynamically
        const group   = document.getElementById("timeSlotsGroup");
        const loading = document.getElementById("timeSlotsLoading");
        const errTime = document.getElementById("errTime");
        if (loading) loading.remove();

        timeSlots.forEach((slot, i) => {
          const slotId = "ts_" + i;
          const row    = document.createElement("div");
          row.className = "time-row";

          const radio   = document.createElement("input");
          radio.type    = "radio";
          radio.id      = slotId;
          radio.name    = "timeSlot";
          radio.value   = slot.label;
          radio.addEventListener("change", applyDayRestriction);

          const lbl     = document.createElement("label");
          lbl.htmlFor   = slotId;
          lbl.className = "time-text";
          lbl.textContent = `${slot.label} (${slot.time_range})`;

          row.appendChild(radio);
          row.appendChild(lbl);
          group.insertBefore(row, errTime);
        });

      } catch (err) {
        console.error("Failed to load form data:", err);
        stakeEl.innerHTML = '<option value="">Error loading — reload page</option>';
        const loading = document.getElementById("timeSlotsLoading");
        if (loading) loading.textContent = "Error loading time slots — reload page.";
      }
    }

    // Populate ward dropdown when stake changes
    stakeEl.addEventListener("change", () => {
      wardEl.innerHTML = "";
      wardEl.value = "";

      if (!stakeEl.value) {
        wardEl.disabled = true;
        wardEl.innerHTML = "<option value=''>Choose a stake first…</option>";
        return;
      }

      const stakeId   = parseInt(stakeEl.value, 10);
      const stakeWards = allWards.filter(w => w.stake_id === stakeId);

      wardEl.disabled = false;
      wardEl.innerHTML = "<option value=''>Select a ward…</option>";
      stakeWards.forEach(w => {
        const opt = document.createElement("option");
        opt.value       = w.id;
        opt.textContent = w.name;
        wardEl.appendChild(opt);
      });
    });

    // If user manually picks a wrong day for a day-restricted slot, snap forward
    dateEl.addEventListener("change", () => {
      const dow = selectedSlotDayRestriction();
      if (dow === null || dow === undefined) return;
      const d = parseLocalDate(dateEl.value);
      if (d && d.getDay() !== dow) {
        dateEl.value = toYyyyMmDd(nextMatchingDay(d, dow));
      }
    });

    // No past dates
    dateEl.min = toYyyyMmDd(new Date());

    /***********************
     * SUBMIT
     ***********************/
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();
      if (isSubmitting) return;
      isSubmitting = true;
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting…";

      try {
        // ── Collect values ────────────────────────────────────
        const fullName  = fullNameEl.value.trim();
        const phoneRaw  = phoneEl.value.trim();
        const email     = emailEl.value.trim().toLowerCase();
        const stakeId   = stakeEl.value ? parseInt(stakeEl.value, 10) : null;
        const wardId    = wardEl.value  ? parseInt(wardEl.value,  10) : null;
        const dateStr   = dateEl.value;
        const timeSlot  = getSelectedTime();
        const smsOptIn  = smsOptInEl.checked;

        // ── Validate ──────────────────────────────────────────
        let ok = true;
        if (!fullName)  { setError("errName",  "Name is required."); ok = false; }

        const phone = normalizePhone(phoneRaw);
        if (!phone)     { setError("errPhone", "Enter a valid US phone number (10 digits)."); ok = false; }

        if (!email)                                             { setError("errEmail", "Email is required."); ok = false; }
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))   { setError("errEmail", "Enter a valid email address."); ok = false; }

        if (!stakeId)   { setError("errStake", "Please select a stake."); ok = false; }
        if (!wardId)    { setError("errWard",  "Please select a ward."); ok = false; }
        if (!dateStr)   { setError("errDate",  "Please choose a date."); ok = false; }
        if (!timeSlot)  { setError("errTime",  "Please select a time slot."); ok = false; }

        // Validate day-of-week restriction for the selected slot
        if (timeSlot && dateStr) {
          const slot = siteTimeSlots.find(s => s.label === timeSlot);
          if (slot && slot.day_of_week !== null && slot.day_of_week !== undefined) {
            const d       = parseLocalDate(dateStr);
            const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
            if (d && d.getDay() !== slot.day_of_week) {
              setError("errDate",
                `${slot.label} is ${dayNames[slot.day_of_week]}s only. Please choose a ${dayNames[slot.day_of_week]}.`);
              ok = false;
            }
          }
        }

        if (!ok) return;

        // ── Normalize for dedup keys ──────────────────────────
        const fullNameKey = fullName.toLowerCase().replace(/\s+/g, " ");
        const phoneKey    = (phone || "").replace(/\D/g, "");

        // ── Build Supabase payload ────────────────────────────
        const payload = {
          site_id:       SITE_ID,
          full_name:     fullName,
          full_name_key: fullNameKey,
          phone:         phone,
          phone_key:     phoneKey,
          email:         email,
          stake_id:      stakeId,
          ward_id:       wardId,
          service_date:  dateStr,
          time_slot:     timeSlot,
          opt_in:        smsOptIn,
          safety_status: "Missing",
          submitted_on:  new Date().toISOString(),
        };

        // ── Insert into Supabase ──────────────────────────────
        const res = await supaInsert("volunteer_signups", payload);

        if (res.status === 201) {
          // Success
          successMsg.textContent = "Thank you! Your signup has been received ✓";
          nextStepsEl.style.display = "block";
          form.reset();
          wardEl.disabled = true;
          wardEl.innerHTML = "<option value=''>Choose a stake first…</option>";
          dateEl.min = toYyyyMmDd(new Date());

        } else if (res.status === 409) {
          // Duplicate — unique constraint hit
          setError("errSubmit",
            "It looks like you're already signed up for this date and time slot. " +
            "If you think this is a mistake, please contact us.");

        } else {
          // Unexpected error
          const body = await res.text();
          console.error("Supabase insert error:", res.status, body);
          setError("errSubmit",
            "Something went wrong (" + res.status + "). Please try again or contact us.");
        }

      } catch (err) {
        console.error("Submit error:", err);
        setError("errSubmit", "Network error. Check your connection and try again.");
      } finally {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
      }
    });

    /***********************
     * INIT
     ***********************/
    loadStakesAndWards();
  </script>
</body>
</html>
